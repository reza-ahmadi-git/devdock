<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f7" />
    <script>
      try {
        if (localStorage.getItem("devdock-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#111817");
        }
      } catch {
        // Theme preferences are optional when browser storage is unavailable.
      }
    </script>
    <title>DevDock — Developer workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
